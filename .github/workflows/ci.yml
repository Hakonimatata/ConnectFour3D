name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hent Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Importer prosjektet
        run: godot --headless --path . --import || true

      - name: Kjør tester
        run: godot --headless --path . res://tests/run_tests.tscn

  web:
    # Lager web-bygget og legger det ved som nedlastbar artefakt.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache eksportmaler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Hent Godot og eksportmaler
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz "templates/web_nothreads_*" "templates/version.txt" \
              -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

      - name: Eksporter web
        run: |
          godot --headless --path . --import || true
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
