<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
  <!-- Fire på rad 3D: fire brikker som trapp oppover på skrå (fire på rad i 3D), med en glødende vinnerlinje -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3347"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d4fb8"/>
      <stop offset="0.55" stop-color="#2a90ff"/>
      <stop offset="1" stop-color="#0b44a0"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe6ff"/>
      <stop offset="1" stop-color="#4cc4ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd76a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Brettet: en flat rute i perspektiv -->
  <path d="M18 92 L64 112 L110 92 L64 72 Z" fill="#3a4357" opacity="0.55"/>
  <!-- Vinnerlinjen -->
  <line x1="24" y1="96" x2="104" y2="28" stroke="url(#glow)" stroke-width="9" stroke-linecap="round"/>
  <!-- Fire brikker, hver ett lag høyere -->
  <g transform="translate(30 86)">
      <path d="M-14 0 v9 a14 6 0 0 0 28 0 v-9 z" fill="url(#side)"/>
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="url(#top)"/>
      <ellipse cx="0" cy="0" rx="7" ry="3" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"/>
  </g>
  <g transform="translate(52 70)">
      <path d="M-14 0 v9 a14 6 0 0 0 28 0 v-9 z" fill="url(#side)"/>
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="url(#top)"/>
      <ellipse cx="0" cy="0" rx="7" ry="3" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"/>
  </g>
  <g transform="translate(75 54)">
      <path d="M-14 0 v9 a14 6 0 0 0 28 0 v-9 z" fill="url(#side)"/>
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="url(#top)"/>
      <ellipse cx="0" cy="0" rx="7" ry="3" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"/>
  </g>
  <g transform="translate(98 38)">
      <path d="M-14 0 v9 a14 6 0 0 0 28 0 v-9 z" fill="url(#side)"/>
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="url(#top)"/>
      <ellipse cx="0" cy="0" rx="7" ry="3" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"/>
  </g>
</svg>
