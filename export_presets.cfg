custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>
#status{background:radial-gradient(ellipse at 50% 30%,#464d5c 0%,#343a47 35%,#1a1d24 100%);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#e4e6eb}
#ld{display:flex;flex-direction:column;align-items:center;text-align:center}
#ld img{width:112px;height:112px;border-radius:26px;box-shadow:0 12px 40px rgba(42,144,255,.35);animation:ld-float 2.4s ease-in-out infinite}
#ld h1{margin:22px 0 0;font-size:34px;font-weight:700;letter-spacing:.5px}
#ld p{margin:4px 0 0;font-size:16px;color:#8d93a0;letter-spacing:3px}
#status-progress{position:static;width:min(260px,60vw);height:6px;margin:34px auto 0;border:0;border-radius:3px;background:#2b303a;overflow:hidden;-webkit-appearance:none;appearance:none}
#status-progress::-webkit-progress-bar{background:#2b303a;border-radius:3px}
#status-progress::-webkit-progress-value{background:linear-gradient(90deg,#6a83b8,#2a90ff);border-radius:3px}
#status-progress::-moz-progress-bar{background:linear-gradient(90deg,#6a83b8,#2a90ff);border-radius:3px}
#ld-text{margin-top:12px;font-size:14px;color:#8d93a0}
#status-notice{margin-top:24px}
@keyframes ld-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
var s=document.getElementById('status'),p=document.getElementById('status-progress');if(!s||!p)return;
var en=!/^(nb|no|nn)/i.test(navigator.language||'');
function el(tag,text){var e=document.createElement(tag);if(text)e.textContent=text;return e;}
var box=el('div');box.id='ld';
var img=el('img');img.src='index.apple-touch-icon.png';img.alt='';box.appendChild(img);
box.appendChild(el('h1',en?'Four in a Row':'Fire på rad'));
box.appendChild(el('p',en?'in 3D':'i 3D'));
s.insertBefore(box,p);
var t=el('div',en?'Loading…':'Laster spillet…');t.id='ld-text';p.insertAdjacentElement('afterend',t);
});
</script>"
